server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Arquivos gerados pelo Vite têm hash no nome: podem ficar em cache por muito tempo
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Rotas do React Router (BrowserRouter): qualquer caminho que não for arquivo volta para o index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
